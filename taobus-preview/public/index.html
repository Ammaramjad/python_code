:root {
  --ink:#1a362c; --muted:#4a675c; --nav:#153a2c; --accent:#00685f;
  --tint:#e6f4ef; --border:#c6d6d6; --paper:#fff; --canvas:#f2f6f5;
  --focus:#a94e00; --shadow:0 3px 14px #14383c0c;
}

aside,.poster {background:var(--nav);color:#f5faf8}
.poster {background:linear-gradient(150deg,#153a2c 0%,#174e52 72%,#176056 100%)}
.poster .map {color:#71dac3}
.poster .map text {fill:#fff}
.brand .logo {background:#b5ecdb;color:#123d41}
.nav button {color:#e0edea;font-weight:550}
.nav button:hover {background:#244b52}
.nav button.active {background:#c4ecdc;color:#153d3d;box-shadow:inset 3px 0 #4eb49b}
.bar {border-color:var(--border);color:var(--muted)}
.content {padding-block:clamp(18px,2.8vw,42px)}
.title,.signin h2,.sc h2,.mo h2 {letter-spacing:-.035em;color:var(--ink)}

.panel,.metric,.mo-panel,.mo-metric,.sc,.driver-card,.choice-box,.mo-dialog,.sc-dialog {
  border-color:var(--border);border-radius:12px;box-shadow:var(--shadow)
}
.mo,.sc,.sc-dialog {color:var(--ink);--sc-green:var(--accent);--sc-line:var(--border);--sc-ink:var(--ink)}
.action,.mo-btn,.sc .sc-add,.sc-dialog .sc-add,.signin .action {background:var(--accent);color:white}
.mo-light,.sc-switch,.sc button.selected,.choice-list button[aria-pressed=true] {background:var(--tint);color:#124d46}
button.choice-trigger,.sc [data-table-view] {background:white;color:#164e4a;border:1px solid #9ebbb6;border-radius:8px;padding:7px 11px}
.sc [data-table-view][aria-pressed=true] {color:white;background:var(--accent)}
.run-ticket.lane-1 {background:#fff2da;color:#613b08;border-top-color:#bd7517}
.run-ticket.lane-2 {background:#e2f2ef;color:#164e49;border-top-color:#25857b}
.mo-table th,.service-table thead th {background:#eaf1f0;color:#365348}
.service-table {font-variant-numeric:tabular-nums}
.service-table .ticket-label {display:none}
.service-table th,.service-table td {border-color:var(--border)}
.mo-table tbody tr:hover {background:#edf7f3}
:where(button,a,input,select,summary):focus-visible {outline:3px solid var(--focus);outline-offset:2px}

body{background:#0c100e;color:#f8f6ef}
.shell,.auth{background:linear-gradient(180deg,#080c0b9c,#0c0e0bd6 48%,#0b0e0df7),var(--bus-photo) center 42%/cover no-repeat,#121714}
.shell{grid-template-columns:84px minmax(0,1fr)}.shell aside{background:#080b09b8;border-right:1px solid #ffffff21;padding:18px 8px;align-items:center}
.shell aside .brand>div,.shell .profile{font-size:0}.shell aside .brand small{display:none}.shell .logo,.auth .logo{background:#ff7135;color:white;border-radius:50%}.shell .nav{width:100%;align-items:center}
.shell .nav button{position:relative;font-size:0;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;border:1px solid #ffffff3d;color:#fff;background:#151916}.shell .nav button .ico{display:block;width:22px}.shell .nav button.active{color:#141511;background:white}.shell .nav button:hover{color:white;background:#873d20}.shell .nav button:focus-visible{outline-color:#ff8849}
.shell .profile .textbtn{font-size:12px;color:white;text-align:center;padding:8px}
.workspace .bar{color:#eeeae1;background:#101410cc;border-color:#ffffff22}.workspace .content>.title{background:#111610dc;color:#fff;border-color:#ffffff21}.module-surface{background:transparent}
.dispatch-hero{min-height:clamp(140px,23vh,235px);display:grid;align-content:center;text-align:center;gap:4px;background:linear-gradient(0deg,#131512ee,transparent 50%),linear-gradient(90deg,#090d09a8,#14191366,#090d09b8),var(--bus-photo) center 46%/cover;border:1px solid var(--edge);border-radius:20px;padding:20px}.dispatch-hero h2{font-weight:550;font-size:clamp(25px,3.2vw,47px);margin:0;letter-spacing:-.035em;color:white;text-shadow:0 1px 10px #000}.dispatch-hero time{color:#ffe4ce;font-size:14px}
.dispatch-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(150px,1.1fr);gap:10px;margin:10px 0 16px}.dispatch-summary article,.shell .module-surface .metric{padding:16px;border:1px solid #ffffff28;border-radius:18px;background:linear-gradient(145deg,#32352ceb,#171a18ed);color:white}.dispatch-summary article{display:grid;align-content:space-between;gap:10px;min-height:100px}.dispatch-summary small{color:#e0e1d9}.dispatch-summary strong{font:550 clamp(24px,3vw,38px)/1 system-ui;color:#fff}.dispatch-summary meter{width:100%;accent-color:#ff783b}.dispatch-summary article:last-child strong{color:#ff975d}
.auth{grid-template-columns:minmax(0,1.3fr) minmax(320px,.8fr)}.auth .poster{background:transparent;justify-content:flex-end}.auth .poster .map{display:none}.auth .signin{background:#191d18ed;border:1px solid var(--edge);color:white}.auth .signin p,.auth .signin header{color:#d3d6cd}
.shell .module-surface :is(.panel,.mo-panel,.driver-card,.sc,.driver-profile,.lv-desk,.hub,.ledger-record),body dialog:is(.mo-dialog,.sc-dialog,.choice-box){background:#20241fee;color:#f1f1ea;border-color:#ffffff30;border-radius:16px}
.shell .module-surface :is(.panel,.mo-panel,.sc) :is(h2,h3,h4),.shell .muted{color:inherit}.shell .module-surface :is(.action,.sc-add,.mo-btn:not(.mo-light,.mo-delete)),.auth .action{background:#ff8549;color:#21160e}.shell :is(.pill,.mo-light),.auth .pill{background:#30352e;color:white;border-color:#ffffff45}
.shell .module-surface table{background:#fff;color:#22281f}.shell .module-surface table thead th{background:#32392f;color:#fff}.shell .module-surface table tbody tr:nth-child(even){background:#edf0e9}.shell .module-surface table tbody tr:hover{background:#ffead7}

  const day=new Date(value+'T12:00:00Z'),original=day.getUTCDate();
  if(unit==='day')day.setUTCDate(original+step);
  else{
    day.setUTCDate(1);
    day.setUTCMonth(day.getUTCMonth()+step*(unit==='year'?12:1));
    const last=new Date(day);last.setUTCMonth(last.getUTCMonth()+1,0);
    day.setUTCDate(Math.min(original,last.getUTCDate()));
  }
  const iso=day.toISOString().slice(0,10);
  return /^\d{4}-\d{2}-\d{2}$/.test(iso)&&iso.slice(0,4)!=='0000'?iso:value;
}
// Read-only projections of the same records used by the dispatcher and reports.
function recordedDashboardRuns(data,day,i){
  const manual=Array.isArray(data.days?.[day]?.[i]);
  const shifts=(data.shifts||[]).filter(s=>s.date===day&&Number(s.route)===i);
  const periods=(data.periods||[]).filter(p=>p.route===i&&p.start<=day&&day<=p.end);
  const logs=new Set((data.tripLogs||[]).filter(l=>l.date===day).map(l=>l.key));
  const leave=(data.leave||[]).some(l=>l.date<=day&&day<=(l.until||l.date));
  if(!manual&&!shifts.length&&!periods.length&&!logs.size&&!leave)return [];
  const effective=window.moduleEffectiveTrips(data,day,i);
  if(manual)return effective;
  return effective.filter(x=>x.originalDriver||logs.has([day,i,x.lane,x.group].join('/'))||
    shifts.some(s=>Number(s.lane)===Number(x.lane)&&s.start<=x.time&&x.time<=s.end)||
    periods.some(p=>p.lane===x.lane&&Number(x.group)>=p.first&&Number(x.group)<=p.last&&
      (!p.parity||Number(x.group)%2===(p.parity==='odd'?1:0))&&(!p.openOnly||x.driver===p.driver)));
}
function fuseDashboard(c, section) {
  const {t,esc,data,date}=c;
  const params=new URLSearchParams(location.search);
  const selected=params.get('metric') || (section==='finance'?'fares':'runs');
  const overview=section==='overview',fullDay=overview&&params.get('panel')==='day';
  const available=section==='finance'?['fares','passengers','entries']:overview?['runs','assigned','open','drivers']:['runs','open','rate'];
  const requested=fullDay?'runs':overview&&selected==='rate'?'assigned':selected;
  const metric=available.includes(requested)?requested:available[0];
  const card=(key,label,value)=>'<button type="button" class="fx-card fx-stat" data-metric="'+key+'" aria-pressed="'+(key===metric)+'"><h3>'+esc(label)+'</h3><strong>'+esc(value)+'</strong></button>';
  const table=(heads,rows,attributes=[])=>'<div class="fx-scroll"><table><thead><tr>'+heads.map(h=>'<th scope="col">'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map((row,i)=>'<tr '+(attributes[i]||'')+'>'+row.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
  const month=/^\d{4}-(0[1-9]|1[0-2])$/.test(params.get('month')||'')?params.get('month'):date.slice(0,7);
  const monthField='<label class="fx-period">'+t('報表月份','Reporting month')+'<input data-parts="native" data-fx-month type="month" required value="'+month+'"></label>';
  function bars(title,series,dimension){
    const max=Math.max(1,...series.map(x=>x[1]));
    return '<article class="fx-card"><h2>'+title+'</h2><div class="fx-bars"><button type="button" class="fx-bar-row" data-fx-all aria-pressed="true"><span>'+t('全部','All')+'</span></button>'+series.map(([label,n],index)=>'<button type="button" class="fx-bar-row" aria-pressed="false" data-dimension="'+dimension+'" data-index="'+index+'"><span>'+esc(label)+'</span><b>'+esc(n)+'</b><i aria-hidden="true"><i style="width:'+(100*n/max)+'%"></i></i></button>').join('')+'</div></article>';

function dashboardCSV(rows){
  const quote=value=>{
    const text=String(value);
    const safe=/^[\s]*[=+@-]/.test(text)&&!/^[-+]?\d+(\.\d+)?$/.test(text)?"'"+text:text;
    return '"'+safe.replaceAll('"','""')+'"';
  };
  return '\uFEFF'+rows.map(row=>row.map(quote).join(',')).join('\r\n')+'\r\n';
}
function exportDates(unit,value){
  const start=unit==='year'?value+'-01-01':unit==='month'?value+'-01':value;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(start))return [];
  const d=new Date(start+'T12:00:00Z');
  if(!Number.isFinite(+d)||d.toISOString().slice(0,10)!==start)return [];
  const dates=[];
  do{
    dates.push(d.toISOString().slice(0,10));d.setUTCDate(d.getUTCDate()+1);
  }while(unit!=='day'&&d.toISOString().startsWith(value+'-'));
  return dates;
}
function exportRuns(data,dates,metric,driver,route,hour){
  const records=[];
  for(const day of dates) data.routes.forEach((r,i)=>{
    if(route&&route!==r.name)return;
    for(const x of recordedDashboardRuns(data,day,i)){
      if(driver&&driver!==x.driver||hour&&hour!==x.time.slice(0,2)+':00')continue;
      if(metric==='open'&&x.driver||['rate','assigned','drivers'].includes(metric)&&!x.driver)continue;
      records.push([day,x.time,r.name,x.group,x.driver||'']);
    }
  });
  return records;
}
function dispatchSheet(result,data,en,range,scope){
  const label=(zh,english)=>en?english:zh;
  const total=result.length,open=result.filter(row=>!row[4]).length;
  const name=label('調度班次','Dispatch runs');
  const rows=[
    [name,range,scope],
    [label('排定班次','Scheduled runs'),total,label('待指派','Unassigned'),open,label('指派率','Assignment rate'),total?((total-open)*100/total).toFixed(1)+'%':'—'],
    [label('營運日','Service date'),label('時間','Departure time'),label('路線','Route'),label('班次','Run number'),label('駕駛','Driver'),label('指派狀態','Assignment status')]
  ];
  const routes=new Map(data.routes.map(r=>[r.name,en?(r.en||r.name):r.name]));
  for(const [date,time,route,run,driver] of result)rows.push([date,time,routes.get(route)||route,run,driver,driver?label('已指派','Assigned'):label('待指派','Unassigned')]);
  return {name,rows,headerRow:3};
}
function bindDashboardExport(c,dashboard,pickers){

    dateRow.append(year.parentElement,month.parentElement,day.parentElement);
    const periodValue=()=>[year.value.padStart(4,'0'),month.value,day.value].slice(0,unit.value==='year'?1:unit.value==='month'?2:3).join('-');
    const selectedFilter=dim=>pickers.find(p=>p.dataset.runFilter===dim)?.selectedOptions[0]?.dataset.key||'';
    const group=selectedFilter('group'),hour=selectedFilter('hour');

          .map(x=>[x.date,x.start||'—',x.driver||'—',x.vehicle||'—',x.passengers??'—',x.fare??'—']);

        else{

            sheets.get(name).rows.push(row);
          }
          if(!sheets.size)sheets.set('',{name:en?'No records':'無紀錄',rows:[headers]});
          file=window.driverWorkbook([...sheets.values()]);
        }
        link.href=URL.createObjectURL(file);
        link.download=['TaoBus',finance?'Finance':driverReport?'Drivers':'Dispatch',periodValue(),key,driverReport?(driver.value||'all-drivers'):'',key==='drivers'?'':selection,language.value].filter(Boolean).join('-').replace(/[\\/:*?"<>|]/g,'-')+ (workbook()?'.xlsx':'.csv');
        document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(link.href),30000);
      }
      dialog.remove();trigger.focus();
    };
    document.body.append(dialog);dialog.showModal();
  };
}
function bindFuseDashboard(c){

function translationSettings(ctx){
 const entries=interfaceCatalog.slice().sort((a,b)=>a[1].localeCompare(b[1]));
 const form=document.querySelector('#translation-form'),catalog=form.querySelector('[data-catalog]');
 let page=0;
 function draw(){
   const body=catalog.querySelector('tbody');body.replaceChildren();
   for(const [zh,en] of entries.slice(page*10,page*10+10)){
     const row=body.insertRow();
     const codes=['en','zh'];
     const labels=codes.map(code=>labelOverrides.get(code+'\t'+zh+'\t'+en)??(code==='zh'?zh:en));
     const cells=labels.map(label=>{const cell=row.insertCell();cell.textContent=label;return cell});
     const action=document.createElement('button');action.type='button';action.textContent=t('編輯','Edit');row.insertCell().append(action);
     action.onclick=()=>{
       const inputs=cells.map((cell,i)=>{const input=document.createElement('input');input.value=labels[i];input.maxLength=240;input.setAttribute('aria-label',codes[i]==='zh'?'繁體中文':'English');cell.replaceChildren(input);return input});
       inputs[0].focus();action.textContent=t('儲存','Save');
       action.onclick=async()=>{
         const rows=(data.interfaceLabels||[]).filter(r=>r[0]!==zh||r[1]!==en||!codes.includes(r[3]||'zh'));
         inputs.forEach((input,i)=>{const label=input.value.trim();if(label&&label!==(i?zh:en))rows.push([zh,en,label,codes[i]])});
         action.disabled=true;
         try{await ctx.save('interfaceLabels',rows);data.interfaceLabels=rows;loadLabels(rows);draw()}catch(error){form.querySelector('[role=status]').textContent=error.message;action.disabled=false}
       };
     };
   }
   const pages=Math.max(1,Math.ceil(entries.length/10));
   catalog.querySelector('output').textContent=(page+1)+' / '+pages+' · '+entries.length;
   catalog.querySelector('[data-prev]').disabled=page===0;catalog.querySelector('[data-next]').disabled=page+1>=pages;
 }
 form.onsubmit=e=>e.preventDefault();
 catalog.querySelector('[data-prev]').onclick=()=>{page--;draw()};
 catalog.querySelector('[data-next]').onclick=()=>{page++;draw()};draw();
 const add=document.querySelector('#new-language');
 add.onsubmit=async e=>{e.preventDefault();const code=add.elements.code.value.trim(),name=add.elements.languageName.value.trim();
   if(languages().some(([key])=>key===code)){add.querySelector('output').textContent=t('語言已存在','Language already exists');return}
   try{const rows=[...extraLanguages,[code,name]];await ctx.save('interfaceLanguages',rows);extraLanguages=rows;editLanguage=code;render()}catch(err){add.querySelector('output').textContent=err.message}
 };
}

function dispatchCharts(trips,t){

 if(unknown)hours.push([unspecified,unknown]);if(unknownOpen)open.push([unspecified,unknownOpen]);

  [t('發車班次','Departures'),trips.length,t('每小時發車班次','Departures by hour'),hours],
  [t('排班駕駛','Assigned drivers'),drivers.size,t('各駕駛的班次','Departures per driver'),[...drivers].sort((a,b)=>b[1]-a[1])],

 ];
}
